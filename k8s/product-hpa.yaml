apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: product-service-hpa
  namespace: microservices

spec:

  minReplicas: 2

  maxReplicas: 5

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: product-service

  metrics:

  - type: Resource

    resource:

      name: cpu

      target:

        type: Utilization

        averageUtilization: 50
