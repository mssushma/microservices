apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: microservices

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:

    metadata:
      labels:
        app: user-service

    spec:

      imagePullSecrets:
        - name: ecr-secret

      containers:

      - name: user-service
        image: USER_IMAGE

        resources:
          requests:
	        cpu: "100m"
	        memory: "128Mi"
          limits:
	        cpu: "500m"
	        memory: "256Mi"

        ports:
        - containerPort: 5000
