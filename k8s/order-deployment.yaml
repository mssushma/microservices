apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: microservices

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: order-service
          image: 774871136295.dkr.ecr.us-east-1.amazonaws.com/order-service-repo:647006126cd37145bb23dc690c576458d4420f2d

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          ports:
            - containerPort: 5000
